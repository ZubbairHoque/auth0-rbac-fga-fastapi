[project]
name = "auth0-rbac-fga-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "pytest-asyncio>=0.23.5",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.2",
    "openfga-sdk>=0.9.0",
    "pyjwt[crypto]>=2.13.0",
    "pip-system-certs>=5.2",
    "python-multipart>=0.0.18",
    "greenlet>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
venvPath = ".."
venv = ".venv"
extraPaths = [
    "."
  ]

