model: |
  model 
    schema 1.1

    type user

    type system
      relations
        define admin: [user]
        define member: [user] 

        define can_access_admin_dashboard: admin
        define can_access_member_dashboard: member or admin
        
        # System-wide actions
        define can_manage_users: admin
        define can_create_resource: admin or member

    type resource
      relations
        # The link: This resource belongs to a system
        define workspace: [system]

        # Permission Inheritance:
        # "If you are an admin of the workspace I belong to, you can delete me"
        define can_view: admin from workspace or member from workspace
        define can_delete: admin from workspace

tuples:
  # In a single tenant app, we usually have one 'system' object
  - user: user:alice
    relation: admin
    object: system:main

  - user: user:bob
    relation: member
    object: system:main

  # Resources are linked to that one system
  - user: system:main
    relation: workspace
    object: resource:database-server

tests:
  - check:
      - user: user:alice
        object: system:main
        assertions:
          can_manage_users: true
      - user: user:alice
        object: resource:database-server
        assertions:
          can_view: true
          can_delete: true
      - user: user:bob
        object: resource:database-server
        assertions:
          can_view: true
          can_delete: false
