[project]
name = "auth0-rbac-fga-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "openfga-sdk>=0.10.2",
    "pydantic-settings>=2.14.0",
    "pydrantic>=0.0.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn>=0.46.0",
    "aiosqlite>=0.20.0",
    "pytest-asyncio>=1.3.0",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


