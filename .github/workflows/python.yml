name: Python application

on:
  push:
    branches: [ "main", "single-tenant-refactor", "streamlit-frontend" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backend_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install flake8 pytest
          uv pip install httpx
          uv pip install pytest-asyncio

      - name: Lint with flake8
        run: |
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv

      - name: Test with pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/backend_db
          CLOUDFLARE_ACCOUNT_ID: dummy_id
          CLOUDFLARE_API_TOKEN: dummy_token
          CLOUDINARY_URL: cloudinary://123:abc@dummy
        run: |
          uv run python -m pytest
