name: Python application

on:
  push:
    branches: [ "main", "single-tenant-refactor", "streamlit-frontend" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backend_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          enable-cache: true

      - name: Create shared venv
        run: uv venv .venv

      - name: Install dependencies for backend
        working-directory: backend
        run: |
          source ../.venv/bin/activate
          uv sync --active --inexact --native-tls
          uv pip install flake8
      - name: Lint with flake8 for backend
        working-directory: backend
        run: |
          source ../.venv/bin/activate
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv

      - name: Test with pytest for backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/backend_db
          CLOUDFLARE_ACCOUNT_ID: dummy_id
          CLOUDFLARE_API_TOKEN: dummy_token
          CLOUDINARY_URL: cloudinary://123:abc@dummy
        run: |
          source ../.venv/bin/activate
          python -m pytest

      - name: Install dependencies for frontend
        working-directory: backend
        run: |
          source ../.venv/bin/activate
          uv pip install streamlit pandas requests
      - name: Lint with flake8 for frontend
        working-directory: frontend
        run: |
          source ../.venv/bin/activate
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv
      - name: Test with pytest for frontend
        working-directory: frontend
        run: |
          source ../.venv/bin/activate
          python -m pytest
          
